<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" font-family="Inter,Helvetica,Arial,sans-serif">
<style>*{transform-box:fill-box}
.car{animation:park 6s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes park{0%{transform:translateY(300px);opacity:0}8%{opacity:1}45%,88%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.ok{animation:ok 6s ease-in-out infinite}
@keyframes ok{0%,40%{opacity:0;transform:scale(.4)}50%,88%{opacity:1;transform:scale(1)}100%{opacity:0}}
.free{animation:fr 1.6s ease-in-out infinite alternate}
@keyframes fr{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
