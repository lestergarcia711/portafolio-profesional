<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" font-family="Inter,Helvetica,Arial,sans-serif">
<style>*{transform-box:fill-box}
.lid{animation:lid 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes lid{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-2deg)}}
.st{stroke-dasharray:14 16;animation:st 2s linear infinite}
@keyframes st{to{stroke-dashoffset:-60}}
.stw{animation:stf 2.4s ease-in-out infinite}
@keyframes stf{0%,100%{opacity:.25;transform:translateY(6px)}50%{opacity:.9;transform:translateY(-8px)}}
.fl{transform-origin:50% 100%;animation:fl .7s ease-in-out infinite alternate}
@keyframes fl{to{transform:scaleY(1.35) scaleX(.9)}}
.fy{animation:fy 3s ease-in-out infinite alternate}
@keyframes fy{to{transform:translateY(-16px) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="800" height="500" fill="#0b4f4a"/>

<circle cx="400" cy="280" r="215" fill="#0f766e"/>
<g class="fy" style="animation-delay:-.4s"><circle cx="190" cy="210" r="26" fill="#f87171"/><path d="M190 184c0-10 8-14 14-14" stroke="#14532d" stroke-width="6" stroke-linecap="round"/></g>
<g class="fy" style="animation-delay:-1.3s"><path d="M590 150l22 42-22 6-22-6z" fill="#fb923c"/><path d="M590 150v-14" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/></g>
<g class="fy" style="animation-delay:-2s"><circle cx="620" cy="300" r="20" fill="#a3e635"/><path d="M606 300h28" stroke="#4d7c0f" stroke-width="4"/></g>
<g class="stw" style="animation-delay:-.3s"><path class="st" d="M360 190c-20-18 20-30 0-52" stroke="#f6f1e7" stroke-width="7" stroke-linecap="round"/></g>
<g class="stw" style="animation-delay:-1s"><path class="st" d="M400 180c-20-18 20-30 0-52" stroke="#f6f1e7" stroke-width="7" stroke-linecap="round"/></g>
<g class="stw" style="animation-delay:-1.7s"><path class="st" d="M440 190c-20-18 20-30 0-52" stroke="#f6f1e7" stroke-width="7" stroke-linecap="round"/></g>
<rect x="258" y="270" width="30" height="14" rx="7" fill="#f6f1e7"/><rect x="512" y="270" width="30" height="14" rx="7" fill="#f6f1e7"/>
<path d="M286 262h228v66a52 52 0 01-52 52H338a52 52 0 01-52-52z" fill="#f6f1e7"/>
<path d="M310 290h40" stroke="#0f766e" stroke-opacity=".25" stroke-width="8" stroke-linecap="round"/>
<g class="lid"><path d="M292 258a108 40 0 01216 0z" fill="#e4dcc6"/><circle cx="400" cy="206" r="11" fill="#134e4a"/><rect x="280" y="254" width="240" height="12" rx="6" fill="#f6f1e7"/></g>
<rect x="250" y="404" width="300" height="14" rx="7" fill="#134e4a"/>
<g fill="#fbbf24"><path class="fl" d="M340 400c-12-16 0-26 0-38 12 10 14 26 0 38z" style="animation-delay:-.1s"/><path class="fl" d="M400 400c-12-16 0-26 0-38 12 10 14 26 0 38z" style="animation-delay:-.4s"/><path class="fl" d="M460 400c-12-16 0-26 0-38 12 10 14 26 0 38z" style="animation-delay:-.25s"/></g>

</svg>