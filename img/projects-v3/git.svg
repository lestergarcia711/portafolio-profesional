<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" font-family="Inter,Helvetica,Arial,sans-serif">
<style>*{transform-box:fill-box}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 7s ease-in-out infinite both}
@keyframes dr{0%{stroke-dashoffset:1}30%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.pp{transform:scale(0);transform-origin:50% 50%;animation:pp 7s ease-out infinite both}
@keyframes pp{0%{transform:scale(0)}5%{transform:scale(1.3)}8%,90%{transform:scale(1)}100%{transform:scale(1);opacity:0}}
.ring{transform-origin:50% 50%;animation:rg 7s ease-out infinite both}
@keyframes rg{0%,40%{transform:scale(1);opacity:0}42%{opacity:.9}70%,100%{transform:scale(3.2);opacity:0}}
.lb{transform-origin:0 50%;animation:lb 7s ease-out infinite both}
@keyframes lb{0%{transform:scaleX(0)}8%,90%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="800" height="500" fill="#7f1d1d"/>

<path class="dr" pathLength="1" d="M110 250H690" stroke="#f6f1e7" stroke-opacity="1" stroke-width="8" stroke-linecap="round" style="animation-delay:0s"/>
<path class="dr" pathLength="1" d="M230 250C270 250 270 150 320 150H480C530 150 530 250 570 250" stroke="#fbbf24" stroke-opacity="1" stroke-width="8" stroke-linecap="round" style="animation-delay:0.6s"/>
<path class="dr" pathLength="1" d="M330 250C370 250 370 350 410 350H470C510 350 510 250 550 250" stroke="#7dd3fc" stroke-opacity="1" stroke-width="8" stroke-linecap="round" style="animation-delay:1.2s"/>
<circle class="pp" cx="110" cy="250" r="15" fill="#7f1d1d" stroke="#f6f1e7" stroke-width="7" style="animation-delay:0s"/><circle class="pp" cx="230" cy="250" r="15" fill="#7f1d1d" stroke="#f6f1e7" stroke-width="7" style="animation-delay:0.4s"/><circle class="pp" cx="320" cy="150" r="15" fill="#7f1d1d" stroke="#f6f1e7" stroke-width="7" style="animation-delay:0.9s"/><circle class="pp" cx="480" cy="150" r="15" fill="#7f1d1d" stroke="#f6f1e7" stroke-width="7" style="animation-delay:1.3s"/><circle class="pp" cx="410" cy="350" r="15" fill="#7f1d1d" stroke="#f6f1e7" stroke-width="7" style="animation-delay:1.5s"/><circle class="pp" cx="470" cy="350" r="15" fill="#7f1d1d" stroke="#f6f1e7" stroke-width="7" style="animation-delay:1.8s"/>
<circle class="ring" cx="570" cy="250" r="15" stroke="#fde68a" stroke-width="5" style="animation-delay:.2s"/>
<circle class="pp" cx="570" cy="250" r="15" fill="#7f1d1d" stroke="#fde68a" stroke-width="7" style="animation-delay:2.2s"/><circle class="pp" cx="690" cy="250" r="15" fill="#7f1d1d" stroke="#f6f1e7" stroke-width="7" style="animation-delay:2.8s"/>
<rect class="lb" x="300" y="112" width="90" height="8" rx="4" fill="#f6f1e7" fill-opacity=".6" style="animation-delay:1s"/><rect class="lb" x="400" y="112" width="50" height="8" rx="4" fill="#f6f1e7" fill-opacity=".6" style="animation-delay:1.4s"/><rect class="lb" x="380" y="382" width="100" height="8" rx="4" fill="#f6f1e7" fill-opacity=".6" style="animation-delay:1.8s"/><rect class="lb" x="560" y="206" width="80" height="8" rx="4" fill="#f6f1e7" fill-opacity=".6" style="animation-delay:2.4s"/>
<rect x="110" y="410" width="580" height="2" fill="#f6f1e7" fill-opacity=".15"/>

</svg>