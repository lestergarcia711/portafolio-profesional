<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" font-family="Inter,Helvetica,Arial,sans-serif">
<style>*{transform-box:fill-box}.sun{transform-origin:50% 50%;animation:b 3s ease-in-out infinite alternate}@keyframes b{to{transform:scale(1.06)}}.tw{animation:t 2s ease-in-out infinite alternate}@keyframes t{to{opacity:.15}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="800" height="500" fill="#4c1d95"/>
<g fill="#f6f1e7"><circle class="tw" cx="90" cy="90" r="4"/><circle class="tw" cx="700" cy="70" r="3" style="animation-delay:-.7s"/><circle class="tw" cx="730" cy="410" r="4" style="animation-delay:-1.2s"/><circle class="tw" cx="110" cy="420" r="3" style="animation-delay:-.3s"/><circle class="tw" cx="640" cy="200" r="3" style="animation-delay:-1.6s"/></g>
<g transform="translate(400 250) rotate(-14)"><ellipse rx="300" ry="90" stroke="#f6f1e7" stroke-opacity=".22" stroke-width="3"/>
<circle r="18" fill="#7dd3fc"><animateMotion dur="9s" begin="0s" repeatCount="indefinite" path="M-300 0a300 90 0 1 0 600 0a300 90 0 1 0 -600 0"/></circle></g>
<g transform="translate(400 250) rotate(22)"><ellipse rx="230" ry="70" stroke="#f6f1e7" stroke-opacity=".22" stroke-width="3"/>
<circle r="14" fill="#2dd4bf"><animateMotion dur="6.5s" begin="-2s" repeatCount="indefinite" path="M-230 0a230 70 0 1 0 460 0a230 70 0 1 0 -460 0"/></circle></g>
<g transform="translate(400 250) rotate(-8)"><ellipse rx="170" ry="50" stroke="#f6f1e7" stroke-opacity=".22" stroke-width="3"/>
<circle r="12" fill="#f6bd60"><animateMotion dur="4.5s" begin="-1s" repeatCount="indefinite" path="M-170 0a170 50 0 1 0 340 0a170 50 0 1 0 -340 0"/></circle></g>
<g class="sun"><circle cx="400" cy="250" r="64" fill="#f6f1e7"/><text x="400" y="268" text-anchor="middle" font-size="48" font-weight="800" fill="#4c1d95">LG</text></g>
<circle cx="400" cy="250" r="84" stroke="#a78bfa" stroke-width="3" stroke-dasharray="4 12" stroke-linecap="round"/>
</svg>